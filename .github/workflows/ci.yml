name: Go CI
on:
  # Branch pushes run as pull requests; release tags run in release.yml.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', 'stable']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Use bundled SQLite headers
        run: echo "CGO_CFLAGS=$(scripts/cgo-flags.sh)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test with race detection
        run: go test -race -tags sqlite_fts5 -count=1 ./...
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Build commands
        run: go build -tags sqlite_fts5 ./cmd/...
